[workspace]
resolver = "3"
members = ["Source/roukaku-editor"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
version = "0.1.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[patch.crates-io]
# Released mlua-sys rejects Luau 744's bytecode version 13 during Lua::new.
# Same upstream loader fix as the root workspace.
mlua-sys = { git = "https://github.com/mlua-rs/mlua", rev = "ff96ed786295cae96f43ef1372bd22be0fbf7866" }

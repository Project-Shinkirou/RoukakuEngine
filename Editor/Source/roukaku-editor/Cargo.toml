[package]
name = "roukaku-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
roukaku-asset = { path = "../../../Engine/Source/Runtime/roukaku-asset" }
roukaku-cook = { path = "../../../Engine/Source/Developer/roukaku-cook" }
roukaku-core = { path = "../../../Engine/Source/Runtime/roukaku-core" }
roukaku-vn-editor = { path = "../../../Engine/Source/Modules/RoukakuVN/roukaku-vn-editor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
roukaku-ui-core = { path = "../../../Engine/Source/Runtime/roukaku-ui-core" }
roukaku-vn-policy = { path = "../../../Engine/Source/Modules/RoukakuVN/roukaku-vn-policy" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rmcp = { version = "=3.4.0", features = ["transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process"] }
agent-client-protocol = "=2.2.0"
gpui = "=0.2.2"
gpui-component = "=0.5.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

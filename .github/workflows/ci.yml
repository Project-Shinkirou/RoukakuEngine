name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  products:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # Official replacements: runner-images/issues/13046 and /13518.
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare pinned native dependencies
        run: cargo xtask deps --target ${{ matrix.target }} --subtitle
      - name: Check engine
        run: cargo xtask check --workspace engine
      - name: Check editor
        run: cargo xtask check --workspace editor

  ffmpeg:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare optional FFmpeg and subtitle dependencies
        run: cargo xtask deps --target x86_64-pc-windows-msvc --ffmpeg --subtitle
      - name: Check media owner
        run: cargo xtask test --workspace engine --package roukaku-media --features ffmpeg-vcpkg

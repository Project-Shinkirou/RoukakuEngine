name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  products:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # Official replacements: runner-images/issues/13046 and /13518.
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Select repository Rust toolchain
        run: rustup show
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool gettext autopoint pkg-config nasm \
            libasound2-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig1-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev clang cmake
      - name: Install macOS assembler
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Prepare pinned native dependencies
        run: cargo xtask deps --target ${{ matrix.target }} --subtitle
      - name: Check engine
        run: cargo xtask check --workspace engine
      - name: Check editor
        run: cargo xtask check --workspace editor

  ffmpeg:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Select repository Rust toolchain
        run: rustup show
      - name: Prepare optional FFmpeg and subtitle dependencies
        run: cargo xtask deps --target x86_64-pc-windows-msvc --ffmpeg --subtitle
      - name: Check media owner
        run: cargo xtask test --workspace engine --package roukaku-media --features ffmpeg-vcpkg

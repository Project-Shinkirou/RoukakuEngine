[package]
name = "roukaku-platform-headless"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
ffmpeg-vcpkg = ["roukaku-media/ffmpeg-vcpkg"]

[dependencies]
base16ct.workspace = true
roukaku-core = { path = "../../Runtime/roukaku-core" }
roukaku-headless-protocol = { path = "../../Runtime/roukaku-headless-protocol" }
roukaku-media = { path = "../../Runtime/roukaku-media" }
roukaku-media-core = { path = "../../Runtime/roukaku-media-core" }
# Headless is publish=false test infrastructure.  It must consume the same
# test-driver command enum as the native Windows E3 driver so Cargo feature
# unification cannot leave its host loop non-exhaustive.
roukaku-platform = { path = "../roukaku-platform", features = ["platform-test-driver"] }
roukaku-platform-common = { path = "../roukaku-platform-common" }
roukaku-ui-core = { path = "../../Runtime/roukaku-ui-core" }
image.workspace = true
hound.workspace = true
postcard.workspace = true
reqwest.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tracing.workspace = true
wgpu.workspace = true
url.workspace = true
tempfile.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio-rustls.workspace = true

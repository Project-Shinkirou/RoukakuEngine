[package]
name = "roukaku-platform-macos"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
roukaku-core = { path = "../../Runtime/roukaku-core" }
roukaku-platform = { path = "../roukaku-platform" }

[features]
default = []
platform-test-driver = [
    "roukaku-platform/platform-test-driver",
    "roukaku-platform-common/platform-test-driver",
]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
roukaku-media = { path = "../../Runtime/roukaku-media" }
roukaku-platform-common = { path = "../roukaku-platform-common" }
roukaku-ui-core = { path = "../../Runtime/roukaku-ui-core" }
accesskit.workspace = true
accesskit_winit.workspace = true
cpal.workspace = true
directories.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-av-foundation = { workspace = true, features = [
    "AVAsset",
    "AVAssetReader",
    "AVAssetReaderOutput",
    "AVAssetTrack",
    "AVMediaFormat",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-media = { workspace = true, features = ["CMBlockBuffer", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = [
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSDictionary", "NSError", "NSString", "NSURL"] }
pollster.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit = { workspace = true, features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
gilrs = { workspace = true, features = ["wgi"] }
rfd.workspace = true

[dev-dependencies]
serde_json.workspace = true

[package]
name = "roukaku-platform"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
platform-test-driver = []

[dependencies]
tracing.workspace = true
roukaku-core = { path = "../../Runtime/roukaku-core" }
roukaku-byte-source = { path = "../../Runtime/roukaku-byte-source" }
roukaku-media-core = { path = "../../Runtime/roukaku-media-core" }
roukaku-ui-core = { path = "../../Runtime/roukaku-ui-core" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSURL", "NSSet"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIApplication", "UIDocumentPickerViewController", "UIDocumentInteractionController", "UIResponder", "UIViewController", "UIWindow", "UIView", "UIScene", "UIWindowScene", "objc2-core-foundation", "block2"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }

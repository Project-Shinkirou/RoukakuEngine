[package]
name = "roukaku-player-android"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
roukaku-core = { path = "../../Runtime/roukaku-core" }
roukaku-byte-source = { path = "../../Runtime/roukaku-byte-source" }
roukaku-observability = { path = "../../Developer/roukaku-observability" }
roukaku-package = { path = "../../Runtime/roukaku-package" }
roukaku-platform = { path = "../../Platform/roukaku-platform" }
roukaku-platform-android = { path = "../../Platform/roukaku-platform-android" }
roukaku-player = { path = "../roukaku-player" }
roukaku-player-core = { path = "../../Runtime/roukaku-player-core" }
roukaku-player-vn = { path = "../roukaku-player-vn" }
roukaku-ui-core = { path = "../../Runtime/roukaku-ui-core" }
roukaku-vn-core = { path = "../../Modules/RoukakuVN/roukaku-vn-core" }
roukaku-vn-package = { path = "../../Modules/RoukakuVN/roukaku-vn-package" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { workspace = true, features = ["game-activity"] }
